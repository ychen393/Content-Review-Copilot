name: Content Review CI
on:
  push:
    branches: [feature/v2-pipeline-foundation, feature/m2-unified-content-tasks, feature/m2-neon-persistence, feature/m2-brief-generation, feature/m2-auto-review-reliability, feature/m2-generation-idempotency, feature/m2-acceptance-gates, feature/m2-live-model-gate, main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: copilot_ci
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: local_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://copilot:local_ci_password@localhost:5432/copilot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_postgres_integration.py
